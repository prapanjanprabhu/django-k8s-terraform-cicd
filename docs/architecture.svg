<text x="415" y="684" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">django-service</text>
<text x="415" y="705" text-anchor="middle" font-size="14" font-weight="400" fill="#0f172a">NodePort → port 8000</text>
<rect x="600" y="657" width="235" height="76" rx="10" fill="#eff6ff" stroke="#94a3b8"/>
