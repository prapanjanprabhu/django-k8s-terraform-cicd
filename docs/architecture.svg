<text x="875" y="923" font-size="14" fill="#475569">Django starts with migrate</text><text x="875" y="944" font-size="14" fill="#475569">then the development server.</text><text x="875" y="971" font-size="14" fill="#475569">No health probes configured.</text><text x="40" y="1030" font-size="14" fill="#475569">Solid arrows: execution or traffic flow. Dashed arrows: configuration and image delivery.</text></g></svg>