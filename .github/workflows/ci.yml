name: Django Kubernetes CI/CD

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Django Tests
    runs-on: ubuntu-latest

    # Throwaway CI values. settings.py reads these via os.environ[...] which
    # raises KeyError when unset, so every one of them is mandatory.
    # These are not secrets: the DB is a disposable service container that
    # is destroyed with the runner.
    env:
      DJANGO_SECRET_KEY: ci-insecure-key-not-used-outside-ci
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: one
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-admin-password

    services:
      # No --health-cmd here on purpose. Quoting a multi-word health command
      # inside `options` is unreliable (the string is re-split on whitespace),
      # and a failing health check makes the whole job abort before any step
      # runs, with the failure hidden inside the service-container group.
      # The "Wait for MySQL" step below does the readiness check instead,
      # where its output is visible.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: one
        ports:
          - 3306:3306

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Runs after pip install so mysqlclient (MySQLdb) is importable.
      # mysqld binds 3306 only once it is ready, so a successful connect is
      # a real readiness signal rather than a guess.
      - name: Wait for MySQL
        run: |
          python - <<'PY'
          import sys, time
          import MySQLdb

          for attempt in range(60):
              try:
                  MySQLdb.connect(host="127.0.0.1", port=3306,
                                  user="root", passwd="root")
              except MySQLdb.Error as exc:
                  print(f"waiting for mysql ({exc.args[0]}) ...", flush=True)
                  time.sleep(2)
              else:
                  print(f"mysql ready after ~{attempt * 2}s")
                  sys.exit(0)

          sys.exit("mysql never became ready after 120s")
          PY

      - name: Django system check
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: |
          python manage.py test
          python -m unittest discover -s scripts -p 'test_*.py'

  publish:
    name: Build and push Docker image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Check Docker Hub secrets
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USER" || { echo "Missing repository secret: DOCKERHUB_USER"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Missing repository secret: DOCKERHUB_TOKEN"; exit 1; }
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: prapanjanprabhu/wrapzy:${{ github.sha }}

  deploy:
    name: Deploy to Minikube
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, wrapzy-deploy]
    environment: minikube
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check deploy runner access
        shell: bash
        env:
          KUBE_CONTEXT: ${{ vars.KUBE_CONTEXT || 'minikube' }}
        run: |
          kubectl --context "${KUBE_CONTEXT:-minikube}" get nodes
          kubectl --context "${KUBE_CONTEXT:-minikube}" -n wrapzy get pods || true
      - name: Apply resources and verify rollout
        shell: bash
        env:
          IMAGE: prapanjanprabhu/wrapzy:${{ github.sha }}
          KUBE_CONTEXT: ${{ vars.KUBE_CONTEXT || 'minikube' }}
        run: bash scripts/deploy.sh
